name: "Formatting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  # The check names below (black (black), black (isort)) are kept unchanged on purpose: they are
  # required status checks in branch protection. Both matrix entries now run ruff under the hood
  # instead of black/isort. Renaming these requires updating the branch protection required-check
  # list in the same change - do not rename silently.
  black:
    name: "black (${{ matrix.tool }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tool: black
            command: ruff format --check .
          - tool: isort
            command: ruff check --select I .
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group linting
      - name: ${{ matrix.tool }} Code Formatter
        run: uv run ${{ matrix.command }}

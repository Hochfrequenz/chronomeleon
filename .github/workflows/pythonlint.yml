name: "Linting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  lint:
    name: Python Code Quality and Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        linter-env: ["linting", "type_check", "spell_check"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group ${{ matrix.linter-env }}
      - name: Run ${{ matrix.linter-env }}
        env:
          PYTHONPATH: src
        run: |
          case "${{ matrix.linter-env }}" in
            linting)
              uv run ruff check src/chronomeleon unittests
              ;;
            type_check)
              uv run mypy --show-error-codes src/chronomeleon --strict
              uv run mypy --show-error-codes unittests --strict
              ;;
            spell_check)
              uv run codespell --ignore-words=domain-specific-terms.txt src
              uv run codespell --ignore-words=domain-specific-terms.txt README.md
              ;;
          esac
